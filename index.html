<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPhase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent-primary: #6366f1;
            --accent-glow: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding-bottom: 70px; }

        header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: bold; font-size: 1.2rem; color: var(--accent-glow); }

        main { padding: 16px; max-width: 600px; margin: 0 auto; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px; }

        input, select, textarea, button { width: 100%; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main); margin-bottom: 10px; font-size: 0.9rem; }
        button { background: var(--accent-primary); color: white; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .modal-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 400px; }
        
        .btn-search { background: linear-gradient(135deg, #6366f1, #818cf8); padding: 14px; font-size: 1rem; border-radius: var(--radius-md); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-compass"></i> MyPhase</div>
        <button onclick="logout()" style="width:auto; padding:6px 12px; margin:0; font-size:0.8rem; background:var(--border);">Sign Out</button>
    </header>

    <main>
        <!-- PROFILE SUMMARY -->
        <div class="card">
            <h3 id="displayProfileName">Loading profile...</h3>
            <p id="displayProfilePhase" style="font-size: 0.85rem; color: var(--accent-glow); margin-top:4px;"></p>
            <p id="displayProfileLoc" style="font-size: 0.8rem; color: var(--text-muted);"></p>
        </div>

        <!-- MATCH / CIRCLE SECTION -->
        <div class="card" style="text-align: center;">
            <h4 style="margin-bottom: 8px; color: var(--accent-glow);"><i class="fa-solid fa-users-viewfinder"></i> Find Your Phase Circle</h4>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 14px;">Discover people who share your exact phase and location.</p>
            
            <!-- زر البحث عن الأشخاص -->
            <button class="btn-search" onclick="findMyCircle()">
                <i class="fa-solid fa-magnifying-glass"></i> Find People in My Phase
            </button>

            <!-- القائمة التي تظهر فيها النتائج بعد الضغط -->
            <div id="circleMembersList" style="margin-top: 16px; text-align: left;"></div>
        </div>

        <!-- DAILY UPDATE SECTION -->
        <div class="card">
            <h4 style="margin-bottom:10px;">Daily Update</h4>
            <textarea id="updateInput" placeholder="Share your update with your phase..." rows="3"></textarea>
            <button onclick="postUpdate()">Post Update</button>
        </div>

        <!-- FEED -->
        <div style="font-weight: bold; margin-bottom: 10px;">Phase Activity Feed</div>
        <div id="feedList"></div>
    </main>

    <!-- AUTH MODAL (التسجيل / تسجيل الدخول) -->
    <div id="authModal" class="modal-overlay">
        <div class="modal-box">
            <h2 id="authTitle" style="color: var(--accent-glow); margin-bottom: 4px;">Sign In</h2>
            <p id="authSub" style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px;">Welcome back! Enter your details.</p>

            <form onsubmit="handleAuth(event)">
                <input type="email" id="authEmail" placeholder="Email" required>
                <input type="password" id="authPassword" placeholder="Password" required minlength="6">
                
                <div id="signUpFields" style="display: none;">
                    <input type="text" id="obName" placeholder="First Name">
                    <div style="display: flex; gap: 6px;">
                        <input type="text" id="obCountry" placeholder="Country" value="Sudan">
                        <input type="text" id="obCity" placeholder="City" value="Khartoum">
                    </div>
                    <label style="font-size: 0.75rem; color: var(--text-muted);">Current Phase:</label>
                    <input type="text" id="obPhase" placeholder="e.g. new city, starting startup" value="new city">
                </div>

                <button type="submit" id="authBtn">Sign In</button>
            </form>

            <p style="text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-top: 12px;">
                <span id="toggleText">Don't have an account?</span> 
                <a href="#" onclick="toggleAuthMode(event)" id="toggleLink" style="color: var(--accent-glow); font-weight: bold;">Create Account</a>
            </p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://liovctvovsyyzcwfjhob.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxpb3ZjdHZvdnN5eXpjd2ZqaG9iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NjYyMzQsImV4cCI6MjEwMTA0MjIzNH0.wK8klwR4K7m2TOF3Qmi1QqprLdLSZJt5T205LTRU8ws";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let myProfile = null;
        let isSignUp = false;

        async function initApp() {
            const { data: { session } } = await db.auth.getSession();
            if (session && session.user) {
                currentUser = session.user;
                await loadUserProfile();
                document.getElementById('authModal').style.display = 'none';
            } else {
                document.getElementById('authModal').style.display = 'flex';
            }

            db.auth.onAuthStateChange(async (event, session) => {
                if (session && session.user) {
                    currentUser = session.user;
                    await loadUserProfile();
                    document.getElementById('authModal').style.display = 'none';
                } else {
                    currentUser = null;
                    document.getElementById('authModal').style.display = 'flex';
                }
            });
        }

        function toggleAuthMode(e) {
            if(e) e.preventDefault();
            isSignUp = !isSignUp;
            document.getElementById('signUpFields').style.display = isSignUp ? 'block' : 'none';
            document.getElementById('authTitle').innerText = isSignUp ? "Create Account" : "Sign In";
            document.getElementById('authBtn').innerText = isSignUp ? "Sign Up" : "Sign In";
            document.getElementById('toggleText').innerText = isSignUp ? "Already have an account?" : "Don't have an account?";
            document.getElementById('toggleLink').innerText = isSignUp ? "Sign In" : "Create Account";
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;

            if (isSignUp) {
                let { data, error } = await db.auth.signUp({ email, password });
                if (error) return alert("Error: " + error.message);
                if (data.user) {
                    currentUser = data.user;
                    await db.from('profiles').insert([{
                        user_id: currentUser.id,
                        first_name: document.getElementById('obName').value || 'User',
                        email: email,
                        country: document.getElementById('obCountry').value || 'Global',
                        city: document.getElementById('obCity').value || 'City',
                        current_phase: document.getElementById('obPhase').value.trim().toLowerCase()
                    }]);
                }
            } else {
                let { data, error } = await db.auth.signInWithPassword({ email, password });
                if (error) return alert("Error logging in: " + error.message);
                currentUser = data.user;
            }

            await loadUserProfile();
            document.getElementById('authModal').style.display = 'none';
        }

        async function loadUserProfile() {
            if (!currentUser) return;
            let { data } = await db.from('profiles').select('*').eq('user_id', currentUser.id).single();
            if (data) {
                myProfile = data;
                document.getElementById('displayProfileName').innerText = `Welcome, ${data.first_name || 'Member'} 👋`;
                document.getElementById('displayProfilePhase').innerText = `Phase: ${data.current_phase}`;
                document.getElementById('displayProfileLoc').innerText = `Location: ${data.city}, ${data.country}`;
                loadFeeds();
            }
        }

        // دالة البحث عن أعضاء الدائرة عند الضغط على الزر
        async function findMyCircle() {
            if (!myProfile) return;
            const list = document.getElementById('circleMembersList');
            list.innerHTML = `<p style="color:var(--text-muted); font-size:0.85rem; text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i> Searching for matched members...</p>`;

            // جلب البروفايلات المطابقة في نفس المرحلة من قاعدة البيانات
            let { data: members, error } = await db.from('profiles')
                .select('*')
                .ilike('current_phase', myProfile.current_phase.trim());

            if (error || !members || members.length === 0) {
                list.innerHTML = `<p style="color:var(--text-muted); font-size:0.85rem; text-align:center;">No other members found in your phase yet.</p>`;
                return;
            }

            // عرض الأعضاء
            list.innerHTML = `
                <div style="font-size:0.85rem; font-weight:bold; margin-bottom:8px; color:var(--accent-glow);">Matched Members (${members.length}):</div>
                ${members.map(m => {
                    const isMe = m.user_id === currentUser.id ? " (You)" : "";
                    return `
                    <div style="background:var(--bg-main); padding:10px 14px; border-radius:var(--radius-md); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-weight:bold; font-size:0.9rem;"><i class="fa-solid fa-circle-user" style="color:var(--accent-glow); margin-right:4px;"></i> ${m.first_name}${isMe}</div>
                            <div style="font-size:0.75rem; color:var(--text-muted);">${m.city}, ${m.country}</div>
                        </div>
                        <span style="font-size:0.75rem; background:var(--border); padding:4px 8px; border-radius:12px;">${m.current_phase}</span>
                    </div>`;
                }).join('')}
            `;
        }

        async function postUpdate() {
            const text = document.getElementById('updateInput').value.trim();
            if (!text) return alert("Please enter an update!");

            const { error } = await db.from('daily_updates').insert([{
                user_id: currentUser.id,
                user_name: myProfile ? myProfile.first_name : 'User',
                phase_name: myProfile ? myProfile.current_phase : 'General',
                update_text: text
            }]);

            if (error) {
                alert("Error posting: " + error.message);
            } else {
                document.getElementById('updateInput').value = '';
                loadFeeds();
            }
        }

        async function loadFeeds() {
            if (!myProfile) return;
            let { data: posts } = await db.from('daily_updates')
                .select('*')
                .ilike('phase_name', myProfile.current_phase.trim())
                .order('created_at', { ascending: false });

            const feed = document.getElementById('feedList');
            if (!posts || posts.length === 0) {
                feed.innerHTML = `<p style="color:var(--text-muted); font-size:0.85rem;">No updates in this phase yet.</p>`;
                return;
            }

            feed.innerHTML = posts.map(p => `
                <div class="card" style="padding:12px; margin-bottom:10px;">
                    <div style="font-weight:bold; font-size:0.85rem; color:var(--accent-glow);">${p.user_name || 'Member'}</div>
                    <div style="font-size:0.9rem; margin-top:4px;">${p.update_text}</div>
                </div>
            `).join('');
        }

        async function logout() {
            await db.auth.signOut();
            location.reload();
        }

        initApp();
    </script>
</body>
</html>
